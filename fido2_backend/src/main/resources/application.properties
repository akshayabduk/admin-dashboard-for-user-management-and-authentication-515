spring.application.name=fido2backend

# =========================
# DataSource (PostgreSQL)
# Values are injected from environment variables. Do NOT hardcode secrets.
# Required env vars (to be provided via container orchestration):
# - SPRING_DATASOURCE_URL (e.g., jdbc:postgresql://host:port/dbname)
# - SPRING_DATASOURCE_USERNAME
# - SPRING_DATASOURCE_PASSWORD
# Optional:
# - SPRING_DATASOURCE_DRIVER_CLASS_NAME (defaults to org.postgresql.Driver)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# HikariCP: do not fail fast on startup if DB is not reachable (preview envs)
spring.datasource.hikari.initialization-fail-timeout=-1

# =========================
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# We rely on Flyway for schema management; disable automatic DDL changes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Do not defer JPA initialization to avoid potential circular dependencies with Flyway
spring.jpa.defer-datasource-initialization=false

# =========================
# Flyway
# Enabled by default, but can be turned off by setting FLYWAY_ENABLED=false for environments without DB.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Flyway will look under classpath:db/migration by default
spring.flyway.locations=classpath:db/migration
# Be tolerant in non-DB environments
spring.flyway.connect-retries=0
spring.flyway.fail-on-missing-locations=false
# Placeholders and out-of-order can be adjusted as needed
spring.flyway.out-of-order=false
spring.flyway.baseline-on-migrate=true

# =========================
# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# =========================
# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Respect X-Forwarded-* / Forwarded headers so redirects preserve external scheme/host/port
server.forward-headers-strategy=framework

# =========================
# Server
# Ensure server port as requested in notes (can be overridden by SERVER_PORT env)
server.port=${SERVER_PORT:3001}
