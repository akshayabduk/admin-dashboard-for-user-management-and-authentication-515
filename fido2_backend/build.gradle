plugins {
	id 'java'
	// Checkstyle is intentionally not applied to avoid CI failures without a standard config
	// id 'checkstyle'
	id 'org.springframework.boot' version '3.4.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

checkstyle {
	toolVersion = '10.12.4'
	configFile = file('config/checkstyle/minimal_checks.xml')
}
tasks.withType(Checkstyle).configureEach {
	reports {
		xml.required = false
		html.required = true
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
	implementation 'org.flywaydb:flyway-core'
	// PostgreSQL driver
	runtimeOnly 'org.postgresql:postgresql'
	// Devtools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// In case any Checkstyle tasks exist, disable them to prevent CI failures
apply from: "${rootProject.projectDir}/gradle/checkstyle.gradle"
